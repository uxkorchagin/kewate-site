<title>Сайт Kewate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Entry page of the preview artifact: forwards to the exported site (site.html). */
  :root {
    --bg: #fafafa;
    --fg: #18181b;
    --muted: #71717a;
    --accent: #03a475;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --accent: #6aeec7; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --accent: #6aeec7; color-scheme: dark; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .box { display: grid; gap: 8px; text-align: center; }
  .box p { margin: 0; color: var(--muted); font-size: 14px; }
  .box a { color: var(--accent); font-weight: 600; }
</style>
<div class="box">
  <p>Открываем сайт Kewate…</p>
  <a href="site.html">Открыть сайт</a>
</div>
<script>
  try { location.replace("site.html" + location.hash); } catch (e) {}
</script>
